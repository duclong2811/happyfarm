<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HappyFarm shop thumbnail contact sheet</title>
    <style>
      :root { color-scheme: light; font-family: Nunito, system-ui, sans-serif; background: #f6e4a7; color: #493723; }
      body { margin: 0; padding: 24px; }
      h1 { margin: 0 0 6px; color: #70451d; }
      p { margin: 0 0 20px; color: #7e5c31; }
      #sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 14px; }
      article { min-width: 0; padding: 10px; border: 2px solid #d6a33f; border-radius: 14px; background: #fff5ce; box-shadow: 0 3px 0 #c88d31; }
      .thumb { display: grid; place-items: center; aspect-ratio: 1; overflow: hidden; border-radius: 10px; background: #fffaf0; }
      .thumb img { width: 100%; height: 100%; object-fit: contain; }
      h2 { margin: 9px 0 2px; font-size: 14px; overflow-wrap: anywhere; }
      small { color: #9a6c2e; }
      .error { color: #ae3d2e; font-weight: 800; }
    </style>
  </head>
  <body>
    <h1>Chợ nông sản · thumbnail contact sheet</h1>
    <p>One card per shop row, keyed by itemId. Open through Vite so GLB-backed cards use the same thumbnail renderer as the game.</p>
    <main id="sheet"></main>
    <script type="module" src="/src/shop-thumbnail-contact-sheet.ts"></script>
  </body>
</html>
