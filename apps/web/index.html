<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" /><title>Happy Farm</title></head>
  <body>
    <main class="game-shell"><section class="world" aria-label="Farm world">
      <canvas id="scene" class="scene" width="1440" height="900"></canvas><div class="world-vignette"></div>

      <header id="top-hud" class="top-hud">
        <div class="brand"><span class="brand-mark" data-icon="farm" data-icon-size="24"></span><h1>Happy Farm</h1></div>
        <div class="hud-status">
          <div class="hud-stat hud-stat-gold"><span class="hud-stat-icon" data-icon="coin" data-icon-size="18"></span><strong id="wallet">0 gold</strong><span id="gold-label" class="visually-hidden">Gold</span></div>
          <div class="hud-stat hud-stat-level"><span class="hud-stat-icon" data-icon="star" data-icon-size="18"></span><div id="progression"><strong class="level-value">1</strong></div></div>
          <!--
            Secondary controls, folded behind one overflow button on a phone: the stylesheet keeps them
            in the bar on a wide screen (so the desktop HUD is unchanged) and hides them on a compact
            one until the player asks for them, which is what keeps gold, level and the camera switch
            the only permanent occupants of prime space.
          -->
          <button id="hud-menu-toggle" class="ghost-button hud-menu-toggle" type="button" aria-expanded="false" aria-controls="hud-menu"><span data-icon="more" data-icon-size="18"></span></button>
          <div id="hud-menu" class="hud-menu">
            <button id="language" class="ghost-button" type="button" title="Language"><span data-icon="language" data-icon-size="18"></span></button>
            <button id="refresh" class="ghost-button" type="button" title="Refresh farm"><span data-icon="refresh" data-icon-size="18"></span></button>
          </div>
          <!--
            The camera switch: the estate view designs the island, the character view lives in it.
            Two named buttons rather than one toggle, and always visible, because the player should
            never have to guess which of two very different cameras they are holding.
          -->
          <div id="camera-mode" class="camera-mode" role="group" aria-label="Camera">
            <button id="camera-estate" class="camera-mode-button is-active" type="button" aria-pressed="true">Estate</button>
            <button id="camera-character" class="camera-mode-button" type="button" aria-pressed="false">Character</button>
          </div>
          <!-- Estate view only: put the camera back on the player and follow again. Icon-sized. -->
          <button id="camera-recenter" class="ghost-button camera-recenter" type="button" hidden><span data-icon="target" data-icon-size="18"></span></button>
        </div>
      </header>

      <!-- The one-time character-view hint: four lines, fades itself out. -->
      <p id="camera-hint" class="camera-hint" hidden></p>

      <!--
        The one contextual interaction prompt: what is in reach, and what using it would do. Drawn
        only while something *is* in reach, and only for a keyboard - the touch button inside the
        controls below says the same thing without a key hint. Rendered by `renderInteraction`.
      -->
      <div id="interaction-prompt" class="interaction-prompt" hidden>
        <kbd class="interaction-key">E</kbd>
        <span id="interaction-action" class="interaction-action"></span>
        <span id="interaction-target" class="interaction-target"></span>
      </div>

      <!--
        Touch controls: character view only, and only for a finger (see `mobile/capability.ts`).
        The joystick is a pointer-only convenience that produces the same movement intent the
        keyboard does - it never replaces the keyboard, which remains the accessible path. The Run
        button is a real button with `aria-pressed`, because it is a press-and-hold state rather
        than a stick position.
      -->
      <div id="touch-controls" class="touch-controls" hidden>
        <div id="joystick" class="joystick" aria-hidden="true">
          <div id="joystick-thumb" class="joystick-thumb"></div>
        </div>
        <!-- Shown only while something is in reach; it never reserves space for nothing. -->
        <button id="interact-button" class="interact-button" type="button" hidden></button>
        <button id="run-button" class="run-button" type="button" aria-pressed="false">Run</button>
      </div>

      <nav id="module-rail" class="module-rail" aria-label="Farm modules">
        <button id="harvest-area-global" class="module-launcher" type="button" title="Harvest or plant in area" aria-label="Harvest or plant in area"><span data-icon="harvest" data-icon-size="22"></span></button>
        <button id="inventory-launcher" class="module-launcher" type="button" aria-expanded="false" aria-controls="inventory-panel" title="Inventory"><span data-icon="inventory" data-icon-size="22"></span></button>
        <button id="market-launcher" class="module-launcher" type="button" aria-expanded="false" aria-controls="market-panel" title="Farm Market"><span data-icon="market" data-icon-size="22"></span></button>
        <button id="build-launcher" class="module-launcher" type="button" aria-expanded="false" aria-controls="build-panel" title="Build"><span data-icon="build" data-icon-size="22"></span></button>
        <button id="work-areas-launcher" class="module-launcher" type="button" aria-expanded="false" aria-controls="work-areas-panel" title="Work Areas"><span data-icon="farm" data-icon-size="22"></span></button>
        <button id="workers-launcher" class="module-launcher" type="button" aria-expanded="false" aria-controls="workers-panel" title="Workers"><span data-icon="walk" data-icon-size="22"></span></button>
      </nav>

      <!--
        Auto: the Main Character, the Work Assignments it holds, and what Auto would do next.

        D1 plans and explains; it does not act. Nothing here plants, harvests, travels, unloads or buys,
        the resolver is a pure function of a bounded snapshot, and the panel is read only when it is
        opened and after an Auto action - never on a timer. Rendered by `renderWorkers`.
      -->
      <aside id="workers-panel" class="module-panel auto-panel" aria-labelledby="workers-title" hidden>
        <header class="module-header">
          <h2 id="workers-title">Auto</h2>
          <button id="workers-close" class="panel-close" type="button"><span data-icon="close" data-icon-size="16"></span></button>
        </header>
        <div id="workers-body" class="module-body">
          <p id="workers-note" class="muted" hidden></p>

          <!-- Who works, what they are carrying, and who is driving. -->
          <section id="workers-actor" class="auto-actor" hidden>
            <span class="auto-portrait" data-icon="walk" data-icon-size="24"></span>
            <div class="auto-actor-text">
              <strong id="workers-actor-name"></strong>
              <span id="workers-control" class="auto-chip"></span>
            </div>
            <div class="auto-cargo">
              <span class="auto-cargo-label" data-icon="inventory" data-icon-size="14"></span>
              <span id="workers-cargo-usage" class="auto-cargo-usage"></span>
              <span class="auto-meter"><span id="workers-cargo-bar" class="auto-meter-fill"></span></span>
            </div>
          </section>

          <!-- One control, and the plan it would run. -->
          <section id="workers-auto" class="auto-control" hidden>
            <p id="workers-auto-status" class="auto-status"></p>
            <p id="workers-auto-progress" class="auto-progress muted" hidden></p>
            <button id="workers-auto-toggle" class="primary auto-toggle" type="button"></button>
          </section>

          <div class="auto-toolbar">
            <button id="workers-reorder" class="compact" type="button"></button>
          </div>
          <div id="workers-list" class="auto-assignments" role="list"></div>

          <!--
            Cargo: what the actor is carrying, and the one way it reaches the warehouse. Kept beside
            the assignments because it is the same actor's, and kept small because it is not a second
            inventory screen. Rendered by `renderWorkersCargo`.
          -->
          <section id="workers-cargo" class="workers-cargo" hidden>
            <div class="workers-cargo-head">
              <h3 id="workers-cargo-title" class="auto-section-title"></h3>
            </div>
            <p id="workers-cargo-note" class="muted" hidden></p>
            <div id="workers-cargo-list" class="workers-cargo-list" role="list"></div>
            <button id="workers-cargo-unload" class="primary compact" type="button" hidden></button>
          </section>

          <button id="workers-assign" class="primary compact" type="button"></button>
          <section id="workers-editor" class="workers-editor" aria-live="polite" hidden></section>
        </div>
      </aside>

      <!--
        Work Areas: player-named groups of cells a future Job may be asked to work. Estate view only -
        precision cell picking belongs to the map, not to a character standing in the field. The panel
        is the *only* thing that reads work areas; they are never part of the farm's ordinary loads or
        the growth poll. Rendered by `renderWorkAreas`.
      -->
      <aside id="work-areas-panel" class="module-panel" aria-labelledby="work-areas-title" hidden>
        <header class="module-header">
          <h2 id="work-areas-title">Work Areas</h2>
          <button id="work-areas-close" class="panel-close" type="button"><span data-icon="close" data-icon-size="16"></span></button>
        </header>
        <div id="work-areas-body" class="module-body">
          <button id="work-area-create" class="primary compact" type="button">New area</button>
          <p id="work-areas-note" class="muted" hidden></p>
          <div id="work-area-list" class="work-area-list" role="list"></div>
          <section id="work-area-editor" class="work-area-editor" aria-live="polite" hidden></section>
        </div>
      </aside>

      <aside id="inventory-panel" class="module-panel" aria-labelledby="inventory-title" hidden>
        <header class="module-header">
          <h2 id="inventory-title">Inventory</h2>
          <button id="inventory-close" class="panel-close" type="button"><span data-icon="close" data-icon-size="16"></span></button>
        </header>
        <div id="inventory-body" class="module-body">
          <!--
            The warehouse: one compact strip above the shelf. It is the budget every stored good
            shares, so it belongs at the top of the inventory rather than in a panel of its own.
          -->
          <section id="warehouse" class="warehouse-strip" aria-labelledby="warehouse-title" hidden>
            <div class="warehouse-head">
              <h3 id="warehouse-title">Warehouse</h3>
              <span id="warehouse-tier" class="warehouse-tier"></span>
            </div>
            <p id="warehouse-usage" class="warehouse-usage"></p>
            <div id="warehouse-bar" class="warehouse-bar" aria-label="Warehouse capacity"><span id="warehouse-bar-fill"></span></div>
            <p id="warehouse-next" class="warehouse-next"></p>
            <p id="warehouse-note" class="warehouse-note" hidden></p>
            <button id="warehouse-upgrade" class="primary compact" type="button" hidden></button>
          </section>
          <!--
            The inventory as a shelf, not a table: category tabs over a grid of visual item cards
            (thumbnail, name, quantity). Land is deliberately *outside* the grid - it is not an item.
          -->
          <nav id="inventory-tabs" class="item-tabs" role="tablist" aria-label="Inventory categories"></nav>
          <div id="inventory-grid" class="item-grid" role="list"></div>
          <p id="inventory-empty" class="muted" hidden></p>
        </div>
      </aside>

      <aside id="market-panel" class="module-panel module-panel-right" aria-labelledby="market-title" hidden>
        <header class="module-header">
          <h2 id="market-title">Farm Market</h2>
          <button id="market-close" class="panel-close" type="button"><span data-icon="close" data-icon-size="16"></span></button>
        </header>
        <div class="market-tabs" role="tablist" aria-label="Market direction">
          <button id="market-tab-buy" class="market-tab is-active" type="button" role="tab" aria-selected="true">Buy</button>
          <button id="market-tab-sell" class="market-tab" type="button" role="tab" aria-selected="false">Sell</button>
        </div>
        <div id="market-body" class="module-body">
          <!-- The shelf: visual cards, one per tradeable item. Rendered by `renderMarket`. -->
          <div id="market-grid" class="item-grid" role="list"></div>
          <p id="market-empty" class="muted" hidden></p>
        </div>
        <!--
          The one transaction panel: what is selected, how many, what it totals, and the action. It
          appears only when a card is chosen, which is what keeps quantity controls off every card.
        -->
        <section id="market-trade" class="market-trade" hidden></section>
      </aside>

      <aside id="build-panel" class="module-panel module-panel-build" aria-labelledby="build-title" hidden>
        <header class="module-header build-header">
          <h2 id="build-title"><span class="build-title-icon" data-icon="build" data-icon-size="24"></span><span>Build</span></h2>
          <div class="build-header-right">
            <span id="build-gold" class="build-gold"></span>
            <button id="build-close" class="panel-close" type="button" aria-label="Close"><span data-icon="close" data-icon-size="16"></span></button>
          </div>
        </header>
        <!--
          What the player has put into storage: ordinary objects they own and can place again,
          without buying them a second time. Rendered by `renderBuildStorage`; empty and hidden until
          something is stored.
        -->
        <div id="build-storage" class="build-storage" hidden></div>
        <div class="build-body">
          <nav id="build-rail" class="shop-rail" role="tablist" aria-label="Build categories"></nav>
          <section class="build-center">
            <div id="build-search" class="shop-search"></div>
            <div id="build-rows" class="shop-grid"></div>
          </section>
          <aside id="build-inspector" class="shop-inspector" aria-label="Selected asset"></aside>
        </div>
        <p id="build-status" class="build-status muted"></p>
      </aside>

      <section id="placement-hud" class="placement-hud" aria-label="Placement" hidden></section>

      <!--
        The panel for the built thing the player has selected: what it is, and the actions its own
        asset policy allows. Rendered by `renderObjectPanel`; hidden whenever nothing is selected.
      -->
      <div id="selection-panels" class="selection-panels" aria-live="polite">
        <section id="object-panel" class="placement-hud object-panel" aria-label="Selected object" hidden></section>
        <section id="tree-management-panel" class="placement-hud object-panel tree-management-panel" aria-label="Tree management" hidden></section>
        <section id="aquaculture-panel" class="placement-hud object-panel aquaculture-panel" aria-label="Aquaculture" hidden></section>
        <section id="forestry-construction-panel" class="placement-hud object-panel resource-panel" aria-label="Forestry tree" hidden></section>
        <section id="resource-panel" class="placement-hud object-panel resource-panel" aria-label="Resource profession" hidden></section>
      </div>

      <section id="area-harvest-panel" class="area-harvest-panel" aria-live="polite" hidden></section>
      <button id="area-harvest-progress-dock" class="area-harvest-progress-dock" type="button" hidden></button>
      <section id="neighbor-panel" class="neighbor-panel" aria-live="polite" hidden></section>

      <section id="action-dock" class="action-dock" aria-label="Farm actions" hidden>
        <div class="action-copy"><strong id="selection">Click a field tile</strong><span id="selection-detail">Choose a tile to plant or harvest.</span><button id="dock-expand" class="dock-expand" type="button" hidden></button></div>
        <div class="action-buttons">
          <button id="go" class="go" type="button" hidden><span data-icon="walk" data-icon-size="18"></span><span class="label">Go</span></button>
          <!--
            The planting choice is a row of visual crop cards, not a native select: the picture is what a
            player recognises, and a dropdown is a web form. Rendered by `renderPlantPicker`, one card per
            catalogue entry, with its own availability state.
          -->
          <div id="plant-controls" class="action-controls"><button id="plant" class="primary" type="button" disabled><span data-icon="plant" data-icon-size="18"></span><span class="label">Plant crop</span></button><div id="plant-picker" class="item-picker" role="group"></div></div>
          <div id="crop-controls" class="action-controls" hidden><button id="harvest" class="primary harvest" type="button"><span data-icon="harvest" data-icon-size="18"></span><span class="label">Harvest</span></button><button id="uproot" class="uproot" type="button"><span data-icon="remove" data-icon-size="18"></span><span class="label">Uproot</span></button></div>
          <div id="tree-controls" class="action-controls" hidden><span id="tree-state" class="muted"></span><button id="harvest-tree" class="primary harvest" type="button"><span data-icon="harvest" data-icon-size="18"></span><span class="label">Harvest</span></button><button id="remove-tree" class="uproot" type="button"><span data-icon="remove" data-icon-size="18"></span><span class="label">Remove tree</span></button></div>
          <button id="harvest-area" class="secondary area-harvest-launcher" type="button" hidden></button>
        </div>
      </section>

      <div class="status-wrap">
        <p id="status" class="status">Loading your farm…</p>
        <!-- Shown only when the boot could not establish a session; see renderBootRetry. -->
        <button id="boot-retry" class="ghost-button boot-retry" type="button" hidden>Retry</button>
      </div>
      <!-- The number a harvest paid, rising from what paid it. One element, reused. -->
      <div id="reward-pop" class="reward-pop" hidden aria-hidden="true"></div>
      <!-- The level a harvest reached, and what it opened. One element, reused. -->
      <div id="level-up" class="level-up" role="status" hidden>
        <strong id="level-up-title"></strong>
        <span id="level-up-detail"></span>
      </div>
      <section id="return-popup" class="return-popup" role="dialog" aria-modal="true" hidden>
        <h2 id="return-popup-title"></h2><p id="return-popup-away"></p>
        <h3 id="return-popup-produced"></h3><div id="return-popup-items"></div>
        <p id="return-popup-empty" hidden></p><button id="return-popup-close" class="primary" type="button"></button>
      </section>
      <div class="renderer-state" id="render-3d-state">Preparing 3D world…</div>
      <button id="render-3d" type="button" hidden>Enable 3D</button><div id="field" class="debug-field" hidden></div>
    </section></main><script type="module" src="/src/main.ts"></script>
  </body>
</html>
